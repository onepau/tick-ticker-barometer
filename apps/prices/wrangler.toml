# List-price capture Worker (unit 6). Fetches official list prices from brand and
# authorised-retailer product pages, stores an HTML extract of each page in R2 as
# evidence, and accepts Paul's manual captures from the bookmarklet.
# Not deployed. Needs, before the first deploy (see README.md):
#   - the R2 bucket below created,
#   - the secrets RUN_TOKEN and CAPTURE_TOKEN set (wrangler secret put …),
#   - Cloudflare Access on prices.tick-ticker.com/capture.
name = "tick-ticker-prices"
main = "src/index.ts"
compatibility_date = "2024-11-12"
compatibility_flags = ["nodejs_compat"]

# No workers.dev URL. Custom domain chosen by Paul on 9 November 2026; put /capture
# behind Cloudflare Access (see docs/plans/u8-deploy-runbook.md).
workers_dev = false
routes = [{ pattern = "prices.tick-ticker.com", custom_domain = true }]

[triggers]
# Workers Free plan (confirmed by Paul, 9 November 2026): 10 ms CPU and 50 outgoing
# requests per invocation, at most 5 cron triggers per account. So the monthly run
# is spread thin: every 10 minutes on the 1st to the 3rd of the month (432 firings),
# each working one domain (robots.txt plus up to 5 pages). About 561 pages need
# about 115 firings, so the run normally ends on the 1st; days 2 and 3 are margin
# for rate limits. Once the month's run is finished, a firing does one D1 query.
crons = ["*/10 * 1-3 * *"]

[vars]
# Public origin of this Worker, used by the bookmarklet and the capture page.
PUBLIC_ORIGIN = "https://prices.tick-ticker.com"
# Per cron invocation (Workers Free sizing; on Workers Paid: 40 requests, all
# domains, 600000 ms). Requests include robots.txt.
MAX_REQUESTS_PER_INVOCATION = "6"
MAX_HOSTS_PER_INVOCATION = "1"
INVOCATION_BUDGET_MS = "120000"
# Minimum gap between two requests to the same domain (milliseconds).
MIN_DELAY_MS = "3000"

[[d1_databases]]
binding = "DB"
database_name = "baromontres"
database_id = "40793010-0c4d-4a80-a1af-963a50273fc5"
migrations_dir = "../../migrations"

[[r2_buckets]]
binding = "EVIDENCE"
bucket_name = "tick-ticker-price-evidence"

[observability]
enabled = true
