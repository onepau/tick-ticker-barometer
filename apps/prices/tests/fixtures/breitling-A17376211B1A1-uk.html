<script type="application/ld+json" id="product-jsonld">{"@context":"https://schema.org","@type":"Product","name":"Superocean Automatic 44","description":"Performance and style for all your water-based pursuits.\n\nIn the 1960s, the new sport of scuba diving was all the rage. For divers, timing was everything, and Breitling set out to give them the most clear-cut dive watch possible by eliminating any feature that didn’t support their lifesaving needs underwater. This pared-down watch was named the Slow Motion. What remained were clean lines, chunky luminescent indexes, squared-off hands and a high-contrast dial ring, all aimed at maximum legibility. Practical, yes. But what people really fell in love with was the look.\n\nThe new Superocean retraces the Slow Motion's celebrated design codes, while adding modern features, like a ceramic-inlayed bezel and brightly colored dials. Broad hands and indexes in luminescent Super-LumiNova® allow for easy readability underwater. The watch is water resistant to 300 m (1000 ft), as well as being shock-, sand- and saltwater-resistant. The bronze version uses a special alloy that has excellent resistance to corrosion, yet will still develop a subtle patina over time that makes the watch even more unique. The two strap options (rubber and metal bracelet) have a folding clasp that allows for micro-adjustments of up to 15 mm for easy wear over rashies and wetsuits. Its scratch-proof ceramic inlayed bezel will never wear or fade. For safety, the bezel is uni-directional on most sizes and bi-directional with a patented lock on the 46 mm.\n\nBest of all, this is no longer strictly a dive watch—surf with it, swim with it, hit the beach bar with it, then wear it out to dinner. The Superocean perfectly balances the nostalgia of its heritage with a fresh new look.","image":["https://www-breitling.eu.saleor.cloud/media/thumbnails/products/a17376211b1a1-soldier_8027a4ed_thumbnail_1024.webp"],"sku":"A17376211B1A1","mpn":"A17376211B1A1","brand":{"@type":"Brand","name":"Breitling"},"offers":[{"@type":"Offer","price":4700,"priceCurrency":"GBP","url":"https://www.breitling.com/gb-en/watches/superocean/superocean-automatic-44-my22/A17376211B1A1/","priceValidUntil":"2026-11-13","itemCondition":"https://schema.org/NewCondition","hasWarranty":{"@type":"WarrantyPromise","durationOfWarranty":{"@type":"QuantitativeValue","value":2,"unitCode":"ANN"},"warrantyScope":"https://purl.org/goodrelations/v1#PartsAndLabor-BringIn"},"availability":"https://schema.org/InStock"}],"category":"Superocean","productID":"A17376211B1A1","url":"https://www.breitling.com/gb-en/watches/superocean/superocean-automatic-44-my22/A17376211B1A1/"}</script>
